async function handleProfileClickContainer(e){
  const copyRow=e.target.closest('[data-copy]');
  if(copyRow&&copyRow.dataset.copy){
    try{await navigator.clipboard?.writeText(copyRow.dataset.copy)}catch(err){}
    flashToast(`${t('toastCopied')}: ${copyRow.dataset.copy}`);return;
  }
  const toggleBtn=e.target.closest('[data-post-toggle]');
  if(toggleBtn){
    const pid=toggleBtn.dataset.postToggle;
    const post=(db.profile.posts||[]).find(x=>x.id===pid);
    if(post){post.archived=!post.archived;save();profileSidebarContent.innerHTML=buildProfileMarkup();if(!settingsView.classList.contains('hidden'))renderSettingsPage()}
    return;
  }
  const btn=e.target.closest('[data-pact]');if(btn){handleProfileAction(btn.dataset.pact);return}
  const tab=e.target.closest('[data-ptab]');if(tab){profileSubTab=tab.dataset.ptab;profileSidebarContent.innerHTML=buildProfileMarkup();if(!settingsView.classList.contains('hidden'))renderSettingsPage()}
}
profileSidebarContent.addEventListener('click',handleProfileClickContainer);

async function handleProfileAction(act){
  if(act==='setphoto'){
    const inp=document.createElement('input');inp.type='file';inp.accept='image/*';
    inp.onchange=async()=>{const f=inp.files&&inp.files[0];if(!f)return;try{db.profile.avatar=await compressImage(f,600,0.85);save();renderSettingsProfileCard();profileSidebarContent.innerHTML=buildProfileMarkup();if(!settingsView.classList.contains('hidden'))renderSettingsPage();flashToast(t('toastProfileSaved'))}catch(e){}};
    inp.click();
  }else if(act==='edit'){openSettingsPage('edit-profile')}
  else if(act==='settings'){
    chatsPanel.classList.add('hidden');settingsPanel.classList.remove('hidden');profileSidebarPanel.classList.add('hidden');
    [...bottomNav.querySelectorAll('.nav-btn')].forEach(b=>b.classList.toggle('active',b.dataset.nav==='settings'));
    renderSettingsProfileCard();renderSettingsList();closeSettingsPage();
  }else if(act==='qr'){
    flashToast(`Telechat QR: @${db.profile.username||'telechat'}`);
  }else if(act==='copyuser'){
    const u='@'+(db.profile.username||'telechat');
    try{await navigator.clipboard?.writeText(u)}catch(e){}
    flashToast(`${t('toastCopied')}: ${u}`);
  }else if(act==='music'){
    const song=await openDialog({title:t('music'),withInput:true,placeholder:'Artist - Song',defaultVal:db.profile.music||''});
    if(song!==null){db.profile.music=song;save();profileSidebarContent.innerHTML=buildProfileMarkup();if(!settingsView.classList.contains('hidden'))renderSettingsPage()}
  }else if(act==='newpost'){
    const txt=await openDialog({title:'New Profile Post',withInput:true,placeholder:'Write a post for your profile...'});
    if(txt){
      if(!Array.isArray(db.profile.posts))db.profile.posts=[];
      db.profile.posts.unshift({id:uid(),text:txt,time:Date.now(),archived:false});
      save();profileSidebarContent.innerHTML=buildProfileMarkup();if(!settingsView.classList.contains('hidden'))renderSettingsPage();
    }
  }
}
document.getElementById('settingsBackBtn').addEventListener('click',closeSettingsPage);

settingsPage.addEventListener('click',async e=>{
  if(e.target.closest('[data-copy]')||e.target.closest('[data-post-toggle]')||e.target.closest('[data-pact]')||e.target.closest('[data-ptab]')){
    await handleProfileClickContainer(e);return;
  }
  const themeBtnEl=e.target.closest('[data-theme-opt]');if(themeBtnEl){applyTheme(themeBtnEl.dataset.themeOpt);renderSettingsPage();return}
  const opener=e.target.closest('[data-open]');if(opener){openSettingsPage(opener.dataset.open);return}

  if(e.target.id==='clearCacheBtn'){
    const ok=await openDialog({title:t('clearData'),desc:t('clearCacheConfirm'),danger:true});
    if(!ok)return;
    db.chats.forEach(c=>{c.messages.forEach(m=>{if(m.media)delete m.media});delete c.wallpaper});
    db.wallpaper={mode:'default'};save();updateStorageSize();flashToast(t('toastCacheCleared'));return;
  }
  if(e.target.id==='cycleLastSeen'){
    const opts=['Everybody','My Contacts','Nobody'];
    db.tgSettings.privacyLastSeen=opts[(opts.indexOf(db.tgSettings.privacyLastSeen)+1)%opts.length];
    save();renderSettingsPage();return;
  }
  if(e.target.id==='cyclePrivacyPhoto'){
    const opts=['Everybody','My Contacts','Nobody'];
    db.tgSettings.privacyPhoto=opts[(opts.indexOf(db.tgSettings.privacyPhoto)+1)%opts.length];
    save();renderSettingsPage();return;
  }
  if(e.target.id==='saveFirebaseBtn'){
    db.firebase.apiKey=document.getElementById('fbApiKey').value.trim();
    db.firebase.authDomain=document.getElementById('fbAuthDomain').value.trim();
    db.firebase.databaseURL=document.getElementById('fbDbUrl').value.trim();
    db.firebase.projectId=document.getElementById('fbProjectId').value.trim();
    db.firebase.storageBucket=document.getElementById('fbStorageBucket').value.trim();
    db.firebase.messagingSenderId=document.getElementById('fbMessagingSenderId').value.trim();
    db.firebase.appId=document.getElementById('fbAppId').value.trim();
    db.firebase.roomCode=document.getElementById('fbRoomCode').value.trim()||'code3412';
    db.firebase.otaUrl=document.getElementById('fbOtaUrl').value.trim();
    save();scheduleFirebaseInit();flashToast('Firebase Config Saved');return;
  }
  if(e.target.closest('#googleSignInBtn')){
    signInWithGoogle();return;
  }
  if(e.target.id==='googleSignOutBtn'){
    signOutGoogle();return;
  }
  if(e.target.id==='testFirebaseBtn'){
    testFirebaseConnection();return;
  }
  if(e.target.id==='pushOtaReloadBtn'){
    if(fbDb&&db.firebase.connected){
      const room=db.firebase.roomCode||'code3412';
      set(ref(fbDb,`rooms/${room}/ota_version`),{timestamp:Date.now()});
      flashToast('⚡ Sent Live Reload Signal to all connected APKs!');
    }else{
      flashToast('Connect Firebase first, or use Capacitor server.url with VS Code Live Server!');
    }
    return;
  }
  const delF=e.target.closest('.del-folder');
  if(delF){db.folders=db.folders.filter(f=>f.id!==delF.dataset.fid);if(db.activeFolder===delF.dataset.fid)db.activeFolder='all';save();renderSettingsPage();renderFolderChips();renderChatList();return}
  if(e.target.id==='addFolderBtn'){
    const name=await openDialog({title:t('addFolder'),withInput:true,placeholder:t('folderNamePrompt')});
    if(name){db.folders.push({id:uid(),name});save();renderSettingsPage();renderFolderChips()}
    return;
  }
  if(e.target.id==='removeAvatar'){db.profile.avatar='';save();renderSettingsPage();renderSettingsProfileCard();return}
  if(e.target.id==='saveProfile'){
    db.profile.name=document.getElementById('editName').value.trim()||t('you');
    db.profile.username=document.getElementById('editUsername').value.trim().replace(/^@/,'');
    db.profile.mobile=document.getElementById('editMobile').value.trim();
    db.profile.birthday=document.getElementById('editBirthday').value;
    db.profile.music=document.getElementById('editMusic').value.trim();
    db.profile.channelName=document.getElementById('editChannel').value.trim();
    db.profile.channelLink=document.getElementById('editChannelLink').value.trim();
    db.profile.bio=document.getElementById('editBio').value.trim();
    save();renderSettingsProfileCard();profileSidebarContent.innerHTML=buildProfileMarkup();flashToast(t('toastProfileSaved'));closeSettingsPage();return;
  }
  const langBtn=e.target.closest('[data-lang]');
  if(langBtn){
    const kind=settingsStack[settingsStack.length-1];const code=langBtn.dataset.lang;
    if(kind==='language'){currentLang=code;localStorage.setItem(LANG_KEY,code);applyTranslations();renderSettingsPage()}
    else{messageLang=code;localStorage.setItem(MSGLANG_KEY,code);renderSettingsPage()}
    return;
  }
  const sw=e.target.closest('.wp-swatch');
  if(sw){const preset=WALLPAPER_PRESETS.find(p=>p.key===sw.dataset.key);const chat=getActiveChat();if(preset&&chat){chat.wallpaper=JSON.parse(JSON.stringify(preset.wp));save();renderSettingsPage();applyWallpaperTo(messagesEl,wallpaperFor(chat))}return}
  if(e.target.id==='wpApplyAll'){const chat=getActiveChat();if(chat){db.wallpaper=JSON.parse(JSON.stringify(wallpaperFor(chat)));save();flashToast(t('toastWallpaperAll'))}return}
});

settingsPage.addEventListener('change',async e=>{
  if(e.target.dataset&&e.target.dataset.tg){
    db.tgSettings[e.target.dataset.tg]=e.target.checked;save();
    if(e.target.dataset.tg==='notiEnabled'&&e.target.checked&&"Notification" in window){Notification.requestPermission()}
    return;
  }
  if(e.target.id==='editAvatarFile'){
    const f=e.target.files&&e.target.files[0];if(!f)return;
    try{db.profile.avatar=await compressImage(f,600,0.85);save();renderSettingsPage();renderSettingsProfileCard()}catch(err){}
    e.target.value='';
  }
  if(e.target.id==='wpFile'){
    const f=e.target.files&&e.target.files[0];const chat=getActiveChat();if(!f||!chat)return;
    try{chat.wallpaper={mode:'image',value:await compressImage(f,1280,0.78)};save();applyWallpaperTo(messagesEl,wallpaperFor(chat));renderSettingsPage()}catch(err){}
    e.target.value='';
  }
});

function swatchStyle(wp){
  if(!wp||wp.mode==='default')return 'background-color:var(--chat-bg);border:1px solid var(--border)';
  if(wp.mode==='color')return `background:${wp.value};`;
  if(wp.mode==='gradient')return `background-image:${wp.value};`;
  return 'background-color:var(--chat-bg)';
}
function currentWpKey(chat){
  const wp=wallpaperFor(chat);const found=WALLPAPER_PRESETS.find(p=>JSON.stringify(p.wp)===JSON.stringify(wp));return found?found.key:null;
}

/* ================= EVENTS ================= */
sendBtn.addEventListener('click',sendMessage);
msgInput.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();sendMessage()}});
msgInput.addEventListener('input',()=>{msgInput.style.height='auto';msgInput.style.height=Math.min(msgInput.scrollHeight,160)+'px'});
attachBtn.addEventListener('click',e=>{e.stopPropagation();attachBtn.classList.toggle('open');attachMenu.classList.toggle('hidden')});
attachMenu.addEventListener('click',e=>{
  const btn=e.target.closest('[data-upload]');if(!btn)return;
  attachBtn.classList.remove('open');attachMenu.classList.add('hidden');
  document.getElementById({photo:'photoInput',video:'videoInput',audio:'audioInput',file:'fileInput'}[btn.dataset.upload]).click();
});
document.getElementById('photoInput').addEventListener('change',e=>{if(e.target.files[0])sendMedia(e.target.files[0],'photo');e.target.value=''});
document.getElementById('videoInput').addEventListener('change',e=>{if(e.target.files[0])sendMedia(e.target.files[0],'video');e.target.value=''});
document.getElementById('audioInput').addEventListener('change',e=>{if(e.target.files[0])sendMedia(e.target.files[0],'audio');e.target.value=''});
document.getElementById('fileInput').addEventListener('change',e=>{if(e.target.files[0])sendMedia(e.target.files[0],'file');e.target.value=''});

chatListEl.addEventListener('click',e=>{
  const del=e.target.closest('[data-del]');if(del){e.stopPropagation();deleteChat(del.dataset.del);return}
  const item=e.target.closest('.chat-item');if(item)openChat(item.dataset.id);
});
searchInput.addEventListener('input',renderChatList);
folderChips.addEventListener('click',e=>{
  const addBtn=e.target.closest('#addFolderChip');if(addBtn){openSettingsPage('chat-folders');return}
  const chip=e.target.closest('.folder-chip[data-fid]');if(!chip)return;
  db.activeFolder=chip.dataset.fid;save();renderFolderChips();renderChatList();
});
document.getElementById('backBtn').addEventListener('click',closeChatView);
document.getElementById('replyClose').addEventListener('click',cancelReply);
document.getElementById('editClose').addEventListener('click',cancelEdit);
document.getElementById('unpinBtn').addEventListener('click',e=>{e.stopPropagation();const c=getActiveChat();if(c){c.pinnedId=null;save();renderPinned(c)}});

const modalOverlay=document.getElementById('modalOverlay');const newChatName=document.getElementById('newChatName');
document.getElementById('newChatBtn').addEventListener('click',()=>{modalOverlay.classList.remove('hidden');newChatName.value='';setTimeout(()=>newChatName.focus(),50)});
document.getElementById('cancelNewChat').addEventListener('click',()=>modalOverlay.classList.add('hidden'));
document.getElementById('createChat').addEventListener('click',()=>{const n=newChatName.value.trim();if(!n)return;modalOverlay.classList.add('hidden');createChat(n)});

const themeBtn=document.getElementById('themeBtn');
function applyTheme(theme){document.documentElement.setAttribute('data-theme',theme);localStorage.setItem(THEME_KEY,theme);const c=getActiveChat();if(c)applyWallpaperTo(messagesEl,wallpaperFor(c))}
themeBtn.addEventListener('click',()=>{applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');if(!settingsView.classList.contains('hidden'))renderSettingsPage()});

function applyTranslations(){
  document.documentElement.setAttribute('lang',currentLang);
  document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=t(el.dataset.i18n)});
  searchInput.placeholder=t('searchChats');msgInput.placeholder=t('writeMessage');emptyStateText.textContent=t('emptyState');
  renderSettingsProfileCard();renderSettingsList();renderFolderChips();renderChatList();updateNetworkTitle();
}

(function init(){
  document.documentElement.setAttribute('data-theme',localStorage.getItem(THEME_KEY)||'light');
  load();initFirebaseIfConfigured();applyTranslations();
  if(db.activeId&&db.chats.some(c=>c.id===db.activeId))openChat(db.activeId);
})();

// Mobile Touch Long-Press Context Menu
messagesEl.addEventListener('touchstart',e=>{
  const b=e.target.closest('.bubble');if(!b)return;
  const msgEl=b.closest('.msg');const chat=getActiveChat();if(!chat||!msgEl)return;
  const touch=e.touches[0];
  longPressTimer=setTimeout(()=>{
    openCtxMenu(touch.clientX,touch.clientY,chat.id,msgEl.dataset.mid);
    if(navigator.vibrate)navigator.vibrate(15);
  },480);
},{passive:true});
['touchend','touchmove','touchcancel'].forEach(ev=>messagesEl.addEventListener(ev,()=>{clearTimeout(longPressTimer)},{passive:true}));

// Mobile Back Button Support (closes chat or settings instead of exiting APK)
window.addEventListener('popstate',()=>{
  if(!settingsView.classList.contains('hidden'))closeSettingsPage();
  else if(db.activeId)closeChatView();
});

</script>
</body>
</html>
