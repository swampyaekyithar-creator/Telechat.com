<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Telechat</title>
<style>
/* ================= THEME (Preserved Original UI Palette) ================= */
:root{
  --accent:#3390ec;--accent-hover:#2b7fd4;--bg:#fff;--panel:#fff;--chat-bg:#e9eef4;
  --border:#e6e9ee;--text:#0f1419;--muted:#8a9199;--hover:#f2f4f7;
  --bubble-in:#fff;--bubble-out:#3390ec;--bubble-out-text:#fff;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.10);--danger:#e5484d;
  --lux-ring:rgba(51,144,236,.28);
}
[data-theme="dark"]{
  --bg:#17212b;--panel:#17212b;--chat-bg:#0e1621;--border:#243240;--text:#f5f7fa;
  --muted:#7f91a4;--hover:#202b36;--bubble-in:#182533;--bubble-out:#2b5278;--shadow:none;
  --lux-ring:rgba(94,181,247,.32);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Pyidaungsu","Myanmar Text","Noto Sans Myanmar",sans-serif;background:var(--bg);color:var(--text);overflow:hidden;font-size:15px}
button{font-family:inherit}
.hidden{display:none!important}
.app{display:flex;height:100vh;width:100vw;position:relative}

/* ---------- Sidebar ---------- */
.sidebar{width:350px;min-width:280px;display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--border);height:100vh;position:relative}
.sidebar-header{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 18px;border-bottom:1px solid var(--border);flex-shrink:0}
.brand{display:flex;align-items:center;gap:10px}
/* Logo hidden per user instructions */
.brand .logo{display:none!important}
.brand h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.25px;transition:color .2s}
.brand h1.offline{color:#f59e0b;font-size:15px}
.header-actions{display:flex;gap:4px}
.icon-btn{width:36px;height:36px;border-radius:50%;border:none;background:transparent;color:var(--muted);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;transition:background .15s,color .15s;flex-shrink:0}
.icon-btn svg{display:block}
.icon-btn:hover{background:var(--hover);color:var(--accent)}
.icon-btn:active{transform:scale(.94)}
#themeBtn .ico-sun{display:none}
[data-theme="dark"] #themeBtn .ico-moon{display:none}
[data-theme="dark"] #themeBtn .ico-sun{display:block}
.sidebar-panel{flex:1;min-height:0;display:flex;flex-direction:column;overflow-y:auto;padding-bottom:92px}
.sidebar-panel.hidden{display:none}
.search-wrap{padding:10px 12px 6px;flex-shrink:0}
.search-wrap input{width:100%;height:38px;border-radius:19px;border:1px solid var(--border);background:var(--hover);color:var(--text);padding:0 16px;font-size:14px;outline:none;transition:border-color .15s,background .15s}
.search-wrap input:focus{border-color:var(--accent);background:var(--panel)}
.search-wrap input::placeholder{color:var(--muted)}
.folder-chips{display:flex;gap:6px;padding:4px 12px 8px;overflow-x:auto;flex-shrink:0;scrollbar-width:none}
.folder-chips::-webkit-scrollbar{display:none}
.folder-chip{padding:5px 12px;border-radius:14px;background:var(--hover);color:var(--text);font-size:12.5px;font-weight:500;cursor:pointer;border:none;white-space:nowrap;transition:background .15s,color .15s}
.folder-chip:hover{background:var(--border)}
.folder-chip.active{background:var(--accent);color:#fff}
.folder-chip.add{padding:5px 10px;color:var(--accent);font-weight:700}
.chat-list{flex:1;overflow-y:auto;padding:4px 0 12px}
.chat-item{display:flex;align-items:center;gap:12px;padding:9px 12px;margin:1px 8px;border-radius:10px;cursor:pointer;position:relative;transition:background .12s,transform .12s}
.chat-item:hover{background:var(--hover)}
.chat-item:active{transform:scale(.99)}
.chat-item.active{background:var(--accent)}
.chat-item.active .chat-name,.chat-item.active .chat-preview,.chat-item.active .chat-time{color:#fff}
.chat-item.active .chat-preview{opacity:.85}
.chat-item.active .verified{color:#fff}
.avatar{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:17px;flex-shrink:0;user-select:none;overflow:hidden;background-size:cover;background-position:center}
.avatar.sm{width:40px;height:40px;font-size:15px}
.avatar.saved{background:linear-gradient(135deg,#5eb5f7,#3390ec)!important}
.avatar.saved svg{display:block}
.chat-body{flex:1;min-width:0}
.chat-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.chat-name{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px}
.verified{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;background:var(--accent);color:#fff;font-size:10px;flex-shrink:0}
.chat-item.active .verified{background:#fff;color:var(--accent)}
.chat-time{font-size:12px;color:var(--muted);flex-shrink:0}
.chat-preview{font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.badge{background:var(--accent);color:#fff;font-size:11.5px;font-weight:600;min-width:20px;height:20px;border-radius:10px;padding:0 6px;display:flex;align-items:center;justify-content:center}
.chat-item.active .badge{background:#fff;color:var(--accent)}
.del-btn{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;border:none;background:rgba(0,0,0,.08);color:var(--muted);cursor:pointer;display:none;align-items:center;justify-content:center;line-height:1}
.chat-item:hover .del-btn{display:flex}
.del-btn:hover{background:var(--danger);color:#fff}
.del-btn svg{display:block}
.empty-list{padding:40px 20px;text-align:center;color:var(--muted);font-size:13.5px}

/* ---------- Settings panel in sidebar (NO BANNER) ---------- */
#settingsPanel{padding:6px 0 92px}
.settings-profile-card{margin:10px 12px 12px;border-radius:14px;overflow:hidden;background:var(--hover);border:1px solid var(--border);padding:14px;animation:slideUp .35s cubic-bezier(.2,.9,.3,1) backwards}
.settings-avatar-wrap{display:flex;align-items:center;gap:12px}
.settings-avatar{width:64px;height:64px;border-radius:50%;border:2px solid var(--panel);background:linear-gradient(135deg,#37aee2,#1e96c8);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;background-size:cover;background-position:center;flex-shrink:0;box-shadow:0 4px 12px rgba(0,0,0,.14)}
.sp-info{flex:1;min-width:0}
.sp-name{font-weight:700;font-size:16px;display:flex;align-items:center;gap:6px}
.sp-username{font-size:13px;color:var(--accent);margin-top:2px}
.sp-bio{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.4}
.sp-status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#4ade80;margin-right:5px;box-shadow:0 0 0 2px rgba(74,222,128,.25)}
.profile-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding-top:12px}
.p-act{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:10px 4px;color:var(--text);font-size:11.5px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font-family:inherit;transition:background .15s,transform .1s,border-color .15s}
.p-act:hover{background:var(--hover);border-color:var(--accent)}
.p-act:active{transform:scale(.96)}
.p-act svg{color:var(--text)}
.p-act span{line-height:1}

.settings-group{padding:0 8px}
.set-item{width:100%;display:flex;align-items:center;gap:14px;padding:12px 14px;background:transparent;border:none;border-radius:10px;color:var(--text);font-size:14.5px;font-family:inherit;cursor:pointer;text-align:left;transition:background .12s,transform .12s}
.set-item:hover{background:var(--hover)}
.set-item:active{transform:scale(.99)}
.set-item .si-ico{width:34px;height:34px;border-radius:10px;background:var(--hover);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--accent)}
.set-item:hover .si-ico{background:var(--border)}
.set-item .si-arrow{margin-left:auto;color:var(--muted);display:flex;align-items:center}

/* ---------- 3 Floating Centered Luxury Squircle Nav Buttons (No Banner, Not Touching Bottom) ---------- */
.bottom-nav-wrap{
  position:absolute;
  bottom:16px;
  left:50%;
  transform:translateX(-50%);
  z-index:45;
  display:flex;
  align-items:center;
  justify-content:center;
  pointer-events:none;
}
.bottom-nav{
  pointer-events:auto;
  display:flex;
  align-items:center;
  gap:12px;
  background:transparent;
  border:none;
  padding:0;
}
.nav-btn{
  width:56px;
  height:56px;
  border-radius:18px;
  background:var(--panel);
  border:1px solid var(--border);
  color:var(--muted);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  padding:0;
  cursor:pointer;
  font-size:10px;
  font-family:inherit;
  font-weight:600;
  box-shadow:0 8px 22px rgba(16,24,40,.14);
  transition:transform .18s cubic-bezier(.2,.9,.3,1),border-color .18s,color .18s,box-shadow .18s;
}
[data-theme="dark"] .nav-btn{
  background:#1f2c3a;
  border-color:#2d3e50;
  box-shadow:0 10px 24px rgba(0,0,0,.42);
}
.nav-btn svg{display:block;transition:transform .18s}
.nav-btn:hover{
  color:var(--accent);
  border-color:var(--accent);
  transform:translateY(-2px);
}
.nav-btn.active{
  color:var(--accent);
  border-color:var(--accent);
  box-shadow:0 8px 22px var(--lux-ring);
}
.nav-btn.active svg{transform:scale(1.06)}
.nav-avatar-dot{
  width:24px;height:24px;border-radius:50%;
  background:linear-gradient(135deg,#37aee2,#1e96c8);
  color:#fff;font-size:11px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  background-size:cover;background-position:center;
  border:1.5px solid var(--accent);
}

/* ---------- Main ---------- */
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--chat-bg);position:relative}
.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);gap:14px;animation:viewFade .3s ease-out}
.empty-state .big{opacity:.35}
.empty-state p{margin:0;font-size:14.5px}
.chat-view{flex:1;display:flex;flex-direction:column;min-height:0;animation:viewSlideIn .3s cubic-bezier(.2,.9,.3,1)}
.chat-header{height:60px;flex-shrink:0;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--border);position:relative}
.chat-header .chat-info{min-width:0;flex:1}
.chat-header .chat-name{font-size:15.5px}
.chat-status{font-size:12.5px;color:var(--muted);margin-top:1px}
.chat-status.typing{color:var(--accent)}
.header-tools{display:flex;gap:2px;position:relative}
.chat-dropdown{position:absolute;top:46px;right:0;background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 34px rgba(0,0,0,.22);padding:6px;z-index:70;min-width:210px;animation:pop .14s cubic-bezier(.2,.9,.3,1)}
.chat-dropdown button{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:none;background:transparent;color:var(--text);font-size:14px;border-radius:8px;cursor:pointer;text-align:left;font-family:inherit}
.chat-dropdown button:hover{background:var(--hover)}
.chat-dropdown button.danger{color:var(--danger)}
.chat-dropdown button.danger:hover{background:rgba(229,72,77,.12)}
.chat-dropdown button svg{flex-shrink:0}
.pinned-bar{flex-shrink:0;display:flex;align-items:center;gap:10px;padding:7px 16px;background:var(--panel);border-bottom:1px solid var(--border);cursor:pointer;animation:pop .2s cubic-bezier(.2,.9,.3,1)}
.pinned-bar .bar{width:3px;height:26px;background:var(--accent);border-radius:2px;flex-shrink:0}
.pinned-bar .p-body{min-width:0;flex:1}
.pinned-bar .p-name{color:var(--accent);font-weight:600;font-size:12.5px;display:flex;align-items:center;gap:5px}
.pinned-bar .p-text{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.messages{flex:1;overflow-y:auto;padding:20px 6% 16px;display:flex;flex-direction:column;gap:3px;scroll-behavior:smooth;background-color:var(--chat-bg)}
.msg{display:flex;max-width:100%;animation:msgIn .22s cubic-bezier(.2,.9,.3,1)}
.msg.out{justify-content:flex-end}
@keyframes msgIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.bubble{width:fit-content;max-width:min(520px,72%);padding:8px 12px 6px;border-radius:14px;background:var(--bubble-in);box-shadow:var(--shadow);position:relative;word-wrap:break-word;overflow-wrap:anywhere;white-space:pre-wrap;line-height:1.45;font-size:14.5px;cursor:default;-webkit-touch-callout:none}
.msg.out .bubble{background:var(--bubble-out);color:var(--bubble-out-text);border-bottom-right-radius:5px}
.msg.in .bubble{border-bottom-left-radius:5px}
.msg + .msg{margin-top:2px}
.msg.out + .msg.out .bubble{border-bottom-right-radius:14px}
.bubble.media{padding:4px;max-width:min(360px,80%);overflow:hidden}
.bubble.media img.msg-img,.bubble.media video.msg-video{display:block;max-width:100%;max-height:420px;width:auto;height:auto;border-radius:10px;cursor:pointer;background:#000;object-fit:contain}
.bubble.media video.msg-video{cursor:default}
.bubble.media .caption{padding:6px 8px 2px;white-space:pre-wrap;font-size:14.5px}
.bubble.media .quoted{margin:4px 4px 4px}
.bubble.media .meta{padding:0 8px 4px}
.bubble.audio{padding:8px 12px 6px;min-width:240px}
.msg-audio{width:100%;display:block;margin:4px 0 6px}
.bubble.file{padding:10px 12px 6px;min-width:220px}
.file-card{display:flex;align-items:center;gap:12px;padding:6px 4px 8px}
.file-icon{width:44px;height:44px;border-radius:10px;background:rgba(51,144,236,.14);color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.msg.out .file-icon{background:rgba(255,255,255,.2);color:#fff}
.file-info{min-width:0;flex:1}
.file-name{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-size{font-size:11.5px;opacity:.75;margin-top:2px}
.file-dl{background:transparent;border:none;color:var(--accent);cursor:pointer;padding:6px;border-radius:8px;display:flex;align-items:center}
.msg.out .file-dl{color:#fff}
.file-dl:hover{background:rgba(51,144,236,.12)}
.quoted{border-left:3px solid var(--accent);background:rgba(51,144,236,.10);padding:5px 9px;border-radius:6px;margin-bottom:6px;font-size:13px;cursor:pointer}
.msg.out .quoted{border-left-color:#fff;background:rgba(255,255,255,.20)}
.q-name{font-weight:600;font-size:12.5px;color:var(--accent);margin-bottom:1px}
.msg.out .q-name{color:#fff}
.q-text{opacity:.85;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}
.meta{font-size:11px;opacity:.7;display:flex;align-items:center;gap:4px;justify-content:flex-end;margin-top:3px;user-select:none}
.meta .edited{opacity:.8}
.msg.out .meta{color:rgba(255,255,255,.9)}
.tick{font-size:12px;letter-spacing:-1px}
.date-sep{align-self:center;background:rgba(0,0,0,.18);color:#fff;font-size:12px;padding:3px 12px;border-radius:12px;margin:10px 0;letter-spacing:.3px;animation:pop .25s}
[data-theme="dark"] .date-sep{background:rgba(255,255,255,.1)}
.composer-area{flex-shrink:0;background:var(--panel);border-top:1px solid var(--border)}
.reply-bar,.edit-bar{display:flex;align-items:center;gap:10px;padding:8px 16px 0;animation:pop .16s}
.reply-bar .bar,.edit-bar .bar{width:3px;height:34px;border-radius:2px;flex-shrink:0}
.reply-bar .bar{background:var(--accent)}
.edit-bar .bar{background:#f5a623}
.reply-bar .r-body,.edit-bar .r-body{min-width:0;flex:1}
.reply-bar .r-name{color:var(--accent);font-weight:600;font-size:12.5px}
.edit-bar .r-name{color:#f5a623;font-weight:600;font-size:12.5px}
.reply-bar .r-text,.edit-bar .r-text{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.composer{display:flex;align-items:flex-end;gap:8px;padding:12px 6% 16px;position:relative}
.attach-btn{width:44px;height:44px;border-radius:50%;color:var(--muted);background:transparent;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s,transform .15s;flex-shrink:0}
.attach-btn:hover{background:var(--hover);color:var(--accent)}
.attach-btn.open{transform:rotate(45deg);color:var(--accent)}
.attach-btn svg{display:block}
.attach-menu{position:absolute;bottom:74px;left:6%;background:var(--panel);border:1px solid var(--border);border-radius:14px;box-shadow:0 12px 34px rgba(0,0,0,.22);padding:8px;z-index:60;min-width:200px;animation:pop .16s cubic-bezier(.2,.9,.3,1)}
.attach-menu button{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:none;background:transparent;color:var(--text);font-size:14px;border-radius:8px;cursor:pointer;text-align:left;font-family:inherit;transition:background .12s}
.attach-menu button:hover{background:var(--hover)}
.attach-menu button svg{color:var(--accent);flex-shrink:0}
.composer textarea{flex:1;resize:none;border:1px solid var(--border);background:var(--hover);color:var(--text);border-radius:20px;padding:11px 18px;font-size:14.5px;font-family:inherit;line-height:1.4;outline:none;max-height:160px;min-height:44px;transition:border-color .15s,background .15s}
.composer textarea:focus{border-color:var(--accent);background:var(--panel)}
.composer textarea::placeholder{color:var(--muted)}
.send-btn{width:44px;height:44px;border-radius:50%;border:none;background:var(--accent);color:#fff;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:background .15s,transform .1s}
.send-btn svg{display:block}
.send-btn:hover{background:var(--accent-hover)}
.send-btn:active{transform:scale(.94)}

/* ---------- Settings & Profile full page (NO BANNER) ---------- */
.settings-view{flex:1;display:flex;flex-direction:column;min-height:0;background:var(--panel);animation:viewSlideIn .3s cubic-bezier(.2,.9,.3,1)}
.settings-header{height:60px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid var(--border);background:var(--panel)}
.settings-header-left{display:flex;align-items:center;gap:12px}
.settings-header h2{margin:0;font-size:17px;font-weight:600}
.settings-page{flex:1;overflow-y:auto;padding:14px 20px 96px}
.sp-section{margin:6px 0 16px}
.sp-section-title{font-size:12.5px;color:var(--muted);font-weight:600;padding:6px 4px;letter-spacing:.4px;text-transform:uppercase}
.sp-card{background:var(--hover);border-radius:12px;overflow:hidden;border:1px solid var(--border)}
.sp-row{display:flex;align-items:center;gap:14px;padding:13px 16px;border-bottom:1px solid var(--border)}
.sp-row:last-child{border-bottom:none}
.sp-row .sp-ico{width:36px;height:36px;border-radius:10px;background:var(--panel);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--accent)}
.sp-row .sp-body{flex:1;min-width:0}
.sp-row .sp-title{font-size:14.5px;font-weight:500}
.sp-row .sp-sub{font-size:12.5px;color:var(--muted);margin-top:2px;word-break:break-word}
.sp-row .sp-action{color:var(--accent);font-size:13.5px;font-weight:600;background:transparent;border:none;cursor:pointer;padding:6px 10px;border-radius:8px;font-family:inherit;flex-shrink:0}
.sp-row .sp-action:hover{background:var(--border)}
.sp-row .sp-action.danger{color:var(--danger)}
.sp-row .sp-action.danger:hover{background:rgba(229,72,77,.12)}
.sp-desc{font-size:13px;color:var(--muted);padding:0 4px 12px;line-height:1.5}
.storage-bar{height:8px;border-radius:4px;background:var(--border);overflow:hidden;margin:8px 0 4px}
.storage-bar-fill{height:100%;background:linear-gradient(90deg,#4ade80,#3390ec);border-radius:4px;width:0;transition:width .6s cubic-bezier(.2,.9,.3,1)}

/* Toggle Switch */
.switch{position:relative;display:inline-block;width:44px;height:24px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;cursor:pointer;inset:0;background:var(--border);border-radius:24px;transition:.2s}
.slider:before{position:absolute;content:"";height:18px;width:18px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked + .slider{background:var(--accent)}
.switch input:checked + .slider:before{transform:translateX(20px)}

/* Profile view (Preserves original Telechat UI style, NO banner, with full logic from 18186.jpg) */
.profile-view{max-width:520px;margin:0 auto;padding:6px 0 24px}
.profile-avatar-big{width:92px;height:92px;border-radius:50%;border:3px solid var(--border);background:linear-gradient(135deg,#37aee2,#1e96c8);color:#fff;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:700;margin:6px auto 0;background-size:cover;background-position:center;box-shadow:0 6px 18px rgba(0,0,0,.14)}
.profile-view-info{text-align:center;padding:10px 16px 4px}
.profile-view-name{font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
.profile-view-status{font-size:13px;color:var(--muted);margin-top:3px}
.profile-view-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:14px 0}
.profile-view-actions .p-act{padding:12px 6px;font-size:12px;background:var(--hover);border:1px solid var(--border)}
.profile-view-actions .p-act:hover{background:var(--panel);border-color:var(--accent)}
.music-pill{display:inline-flex;align-items:center;gap:6px;padding:5px 14px;border-radius:999px;background:var(--hover);border:1px solid var(--border);font-size:12.5px;color:var(--text);margin:8px auto 2px;cursor:pointer;transition:border-color .15s}
.music-pill:hover{border-color:var(--accent)}
.channel-head{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 4px;font-size:12.5px;font-weight:600;color:var(--accent)}
.sub-pill{font-size:11px;padding:2px 8px;border-radius:999px;background:rgba(51,144,236,.14);color:var(--accent)}
.profile-tabs{display:flex;gap:8px;margin-top:14px;border-bottom:1px solid var(--border);padding-bottom:8px;align-items:center;justify-content:space-between}
.profile-tab-group{display:flex;gap:6px}
.profile-tab-btn{padding:6px 14px;border-radius:999px;border:none;background:var(--hover);color:var(--muted);font-size:12.5px;font-weight:600;cursor:pointer;transition:background .15s,color .15s}
.profile-tab-btn.active{background:var(--accent);color:#fff}

.edit-form{display:flex;flex-direction:column;gap:14px;max-width:520px;margin:0 auto}
.edit-form label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:600}
.edit-form input[type="text"],.edit-form input[type="date"],.edit-form textarea{border:1px solid var(--border);background:var(--hover);color:var(--text);padding:12px 14px;border-radius:10px;font-size:14px;font-family:inherit;outline:none;transition:border-color .15s,background .15s;resize:none}
.edit-form input:focus,.edit-form textarea:focus{border-color:var(--accent);background:var(--panel)}
.upload-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.upload-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:10px;background:var(--hover);border:1.5px dashed var(--border);color:var(--accent);font-weight:600;font-size:13.5px;cursor:pointer;transition:border-color .15s,background .15s}
.upload-btn:hover{border-color:var(--accent);background:rgba(51,144,236,.08)}
.upload-btn input{display:none}
.save-btn{background:var(--accent);color:#fff;border:none;padding:12px;border-radius:10px;font-size:14.5px;font-weight:600;cursor:pointer;font-family:inherit;transition:background .15s,transform .1s}
.save-btn:hover{background:var(--accent-hover)}
.save-btn:active{transform:scale(.98)}

/* Language list */
.lang-list{display:flex;flex-direction:column;gap:2px}
.lang-item{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;background:var(--hover);border:none;border-radius:10px;color:var(--text);font-size:14.5px;font-family:inherit;cursor:pointer;text-align:left;transition:background .12s,transform .12s}
.lang-item:hover{background:var(--border)}
.lang-item:active{transform:scale(.99)}
.lang-item .lang-name{flex:1}
.lang-item .lang-native{font-size:12.5px;color:var(--muted);margin-top:1px}
.lang-item .lang-check{color:var(--accent);display:none}
.lang-item.active .lang-check{display:flex}
.theme-opts{display:flex;gap:8px;padding:4px 0 0}
.theme-opt{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 8px;border-radius:10px;border:1.5px solid var(--border);background:var(--hover);color:var(--text);font-size:13px;cursor:pointer;font-family:inherit;transition:border-color .15s,background .15s,transform .12s}
.theme-opt:hover{border-color:var(--accent);transform:translateY(-2px)}
.theme-opt.active{border-color:var(--accent);background:rgba(51,144,236,.12);color:var(--accent);font-weight:600}

/* Context menu */
.ctx-menu{position:fixed;background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 34px rgba(0,0,0,.22);padding:6px;z-index:80;min-width:210px;animation:pop .14s cubic-bezier(.2,.9,.3,1)}
.ctx-menu button{display:flex;align-items:center;gap:12px;width:100%;padding:9px 12px;border:none;background:transparent;color:var(--text);font-size:14px;border-radius:8px;cursor:pointer;text-align:left;font-family:inherit}
.ctx-menu button:hover{background:var(--hover)}
.ctx-menu button.danger{color:var(--danger)}
.ctx-menu button.danger:hover{background:rgba(229,72,77,.12)}
.ctx-menu button svg{flex-shrink:0}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50;backdrop-filter:blur(2px);animation:fade .18s;padding:16px}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.97)}to{opacity:1;transform:none}}
@keyframes slideUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes viewFade{from{opacity:0}to{opacity:1}}
@keyframes viewSlideIn{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
@keyframes up{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.modal{background:var(--panel);border-radius:14px;width:380px;max-width:92vw;max-height:92vh;overflow-y:auto;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.3);animation:up .22s cubic-bezier(.2,.9,.3,1)}
.modal h2{margin:0 0 6px;font-size:18px}
.modal p{margin:0 0 16px;font-size:13.5px;color:var(--muted)}
.modal input[type="text"]{width:100%;height:44px;border-radius:10px;border:1px solid var(--border);background:var(--hover);color:var(--text);padding:0 14px;font-size:14.5px;outline:none;font-family:inherit}
.modal input[type="text"]:focus{border-color:var(--accent);background:var(--panel)}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
.btn{height:38px;padding:0 18px;border-radius:9px;border:none;font-size:14px;font-weight:500;cursor:pointer;transition:background .15s,transform .1s;font-family:inherit}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.ghost:hover{background:var(--hover)}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-hover)}
.btn.danger{background:var(--danger);color:#fff}
.btn.danger:hover{background:#c93b40}

/* Wallpaper grid */
.wp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:10px;margin:8px 0 18px}
.wp-swatch{height:72px;border-radius:12px;cursor:pointer;border:2px solid transparent;position:relative;overflow:hidden;background-size:cover;background-position:center;transition:transform .16s cubic-bezier(.2,.9,.3,1),border-color .16s,box-shadow .16s;display:flex;align-items:flex-end;justify-content:center}
.wp-swatch:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 6px 18px rgba(0,0,0,.15)}
.wp-swatch.selected{border-color:var(--accent);box-shadow:0 0 0 3px rgba(51,144,236,.25)}
.wp-swatch .lbl{font-size:10px;background:rgba(0,0,0,.5);color:#fff;width:100%;text-align:center;padding:3px 0}
.wp-custom{display:flex;flex-direction:column;gap:10px}
.wp-custom label{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--muted)}
.wp-custom input[type="color"]{width:48px;height:36px;border:1px solid var(--border);border-radius:8px;background:transparent;cursor:pointer;padding:2px}
.wp-custom input[type="text"]{flex:1;height:40px;font-size:13.5px;border:1px solid var(--border);background:var(--hover);color:var(--text);padding:0 12px;border-radius:8px;outline:none;font-family:inherit}
.wp-custom input[type="text"]:focus{border-color:var(--accent)}
.wp-upload{display:flex!important;align-items:center;justify-content:center;gap:8px;height:46px;border-radius:10px;cursor:pointer;border:1.5px dashed var(--border);color:var(--accent)!important;font-weight:600;font-size:13.5px;background:var(--hover);transition:border-color .15s,background .15s}
.wp-upload:hover{border-color:var(--accent);background:rgba(51,144,236,.08)}
.wp-upload input{display:none}
.wp-upload svg{flex-shrink:0}

/* Folders */
.folder-list{display:flex;flex-direction:column;gap:6px;margin:4px 0 12px}
.folder-row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:10px;background:var(--hover);font-size:14px;animation:slideUp .3s backwards}
.folder-row .ico-f{color:var(--accent);display:flex;align-items:center}
.folder-row .del-folder{margin-left:auto;background:transparent;border:none;color:var(--muted);cursor:pointer;padding:4px;border-radius:6px;display:flex;align-items:center}
.folder-row .del-folder:hover{background:rgba(229,72,77,.12);color:var(--danger)}

/* Lightbox */
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.94);display:flex;align-items:center;justify-content:center;z-index:120;cursor:zoom-out;animation:fade .18s}
.lightbox img{max-width:94vw;max-height:94vh;border-radius:8px;object-fit:contain;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:pop .25s cubic-bezier(.2,.9,.3,1)}

::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(128,140,155,.35);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:rgba(128,140,155,.6)}

@media (max-width:820px){
  .sidebar{width:100%}
  .app.show-chat .sidebar{display:none}
  .main{display:none}
  .app.show-chat .main{display:flex}
  .back-btn{display:flex!important}
}
.back-btn{display:none}

/* Mobile APK Native Optimization */
html,body{height:100%;height:100dvh;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.app{height:100vh;height:100dvh;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.sidebar{height:100%}
.bottom-nav-wrap{bottom:calc(16px + env(safe-area-inset-bottom))}
.composer{padding:10px 12px calc(12px + env(safe-area-inset-bottom))}
.messages{padding:14px 12px 16px}
.bubble{max-width:82%}

</style>
</head>
<body>

<div class="app" id="app">

  <aside class="sidebar">
    <header class="sidebar-header">
      <div class="brand">
        <div class="logo" aria-hidden="true"></div>
        <h1 id="brandTitle">Telechat</h1>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="netSimBtn" title="Toggle Online / Waiting for network">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
        </button>
        <button class="icon-btn" id="themeBtn" title="Theme">
          <svg class="ico-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="ico-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button class="icon-btn" id="newChatBtn" title="New chat">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
      </div>
    </header>

    <div id="chatsPanel" class="sidebar-panel">
      <div class="search-wrap"><input id="searchInput" type="text" autocomplete="off" /></div>
      <div class="folder-chips" id="folderChips"></div>
      <div class="chat-list" id="chatList"></div>
    </div>

    <div id="settingsPanel" class="sidebar-panel hidden">
      <div class="settings-profile-card" id="settingsProfileCard"></div>
      <div class="settings-group" id="settingsGroup"></div>
    </div>

    <div id="profileSidebarPanel" class="sidebar-panel hidden">
      <div id="profileSidebarContent" style="padding:10px 14px 28px"></div>
    </div>

    <!-- 3 Floating Centered Luxury Squircle Buttons (Chats, Settings, Profile) -->
    <div class="bottom-nav-wrap">
      <nav class="bottom-nav" id="bottomNav">
        <button class="nav-btn active" data-nav="chats" title="Chats">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5c-1.5 0-2.9-.4-4.1-1L3.5 20.5l1.5-4.4A8.4 8.4 0 0 1 3.5 11.5 8.5 8.5 0 0 1 12 3a8.5 8.5 0 0 1 9 8.5z"/>
            <path d="M8.5 11.5h7M8.5 8.5h4.5"/>
          </svg>
          <span data-i18n="navChats">Chats</span>
        </button>

        <button class="nav-btn" data-nav="settings" title="Settings">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3.2"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
          <span data-i18n="navSettings">Settings</span>
        </button>

        <button class="nav-btn" data-nav="profile" title="Profile">
          <div class="nav-avatar-dot" id="navAvatarDot">W</div>
          <span data-i18n="profile">Profile</span>
        </button>
      </nav>
    </div>
  </aside>

  <main class="main" id="main">
    <div class="empty-state" id="emptyState">
      <div class="big">
        <svg viewBox="0 0 24 24" width="72" height="72" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.9 8.9 0 0 1-3.8-.9L3 20.5l1.5-4.6A8.4 8.4 0 0 1 12 3.1a8.4 8.4 0 0 1 9 8.4z"/></svg>
      </div>
      <p id="emptyStateText">Select a chat to start messaging</p>
    </div>

    <div class="chat-view hidden" id="chatView">
      <header class="chat-header">
        <button class="icon-btn back-btn" id="backBtn" title="Back">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <div class="avatar sm" id="chatAvatar"></div>
        <div class="chat-info">
          <div class="chat-name" id="chatName"></div>
          <div class="chat-status" id="chatStatus"></div>
        </div>
        <div class="header-tools">
          <button class="icon-btn" id="chatMenuBtn" title="More">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="1.4" fill="currentColor"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/><circle cx="12" cy="19" r="1.4" fill="currentColor"/></svg>
          </button>
          <div class="chat-dropdown hidden" id="chatDropdown">
            <button data-act="wallpaper">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="M21 15.5l-4.5-4.5L6 21"/></svg>
              <span data-i18n="wallpaper">Wallpaper</span>
            </button>
            <button data-act="clear" class="danger">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
              <span data-i18n="clearHistory">Clear history</span>
            </button>
          </div>
        </div>
      </header>

      <div class="pinned-bar hidden" id="pinnedBar">
        <div class="bar"></div>
        <div class="p-body">
          <div class="p-name">
            <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 10.8V4h6v6.8l3 3.2H6z"/></svg>
            <span data-i18n="pinnedMessage">Pinned message</span>
          </div>
          <div class="p-text" id="pinnedText"></div>
        </div>
        <button class="icon-btn" id="unpinBtn" title="Unpin">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <div class="messages" id="messages"></div>

      <div class="composer-area">
        <div class="reply-bar hidden" id="replyBar">
          <div class="bar"></div>
          <div class="r-body"><div class="r-name" id="replyName"></div><div class="r-text" id="replyText"></div></div>
          <button class="icon-btn" id="replyClose" title="Cancel">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <div class="edit-bar hidden" id="editBar">
          <div class="bar"></div>
          <div class="r-body"><div class="r-name" id="editLabel">Edit message</div><div class="r-text" id="editPreview"></div></div>
          <button class="icon-btn" id="editClose" title="Cancel">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <div class="composer">
          <button class="attach-btn" id="attachBtn" title="Attach">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
          <div class="attach-menu hidden" id="attachMenu">
            <button data-upload="photo">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="M21 15.5l-4.5-4.5L6 21"/></svg>
              <span data-i18n="attachPhoto">Photo</span>
            </button>
            <button data-upload="video">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
              <span data-i18n="attachVideo">Video</span>
            </button>
            <button data-upload="audio">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
              <span data-i18n="attachAudio">Audio</span>
            </button>

function pick(a){return a[Math.floor(Math.random()*a.length)]}

function fmtTime(ts){const d=new Date(ts);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function fmtListTime(ts){const d=new Date(ts),now=new Date();if(d.toDateString()===now.toDateString())return fmtTime(ts);const dd=String(d.getDate()).padStart(2,'0');const mm=String(d.getMonth()+1).padStart(2,'0');if(d.getFullYear()===now.getFullYear())return `${dd}/${mm}`;return `${dd}/${mm}/${String(d.getFullYear()).slice(2)}`}
function fmtDateSep(ts){const d=new Date(ts);return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`}
function fmtBytes(b){if(!b||b<0)return '0 B';if(b<1024)return b+' B';if(b<1048576)return (b/1024).toFixed(1)+' KB';if(b<1073741824)return (b/1048576).toFixed(2)+' MB';return (b/1073741824).toFixed(2)+' GB'}
function formatBirthdayWithAge(bday){
  if(!bday)return '';
  const d=new Date(bday);if(isNaN(d))return bday;
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const mStr=months[d.getMonth()]||'Apr';
  const dd=String(d.getDate()).padStart(2,'0');
  const yr=d.getFullYear();
  const age=Math.max(0,Math.floor((Date.now()-d.getTime())/(365.25*24*3600*1000)));
  return `${mStr} ${dd}, ${yr} (${age} years old)`;
}

function openDialog({title,desc='',withInput=false,placeholder='',defaultVal='',danger=false}){
  return new Promise(resolve=>{
    const ov=document.getElementById('dialogOverlay');
    const ti=document.getElementById('dialogTitle');
    const de=document.getElementById('dialogDesc');
    const inp=document.getElementById('dialogInput');
    const ok=document.getElementById('dialogOk');
    const ca=document.getElementById('dialogCancel');
    ti.textContent=title;de.textContent=desc;
    ok.className='btn '+(danger?'danger':'primary');
    ok.textContent='OK';ca.textContent=t('cancel');
    if(withInput){inp.classList.remove('hidden');inp.placeholder=placeholder;inp.value=defaultVal;setTimeout(()=>inp.focus(),40)}
    else{inp.classList.add('hidden')}
    ov.classList.remove('hidden');
    const cleanup=(val)=>{ov.classList.add('hidden');ok.onclick=null;ca.onclick=null;resolve(val)};
    ok.onclick=()=>cleanup(withInput?inp.value.trim():true);
    ca.onclick=()=>cleanup(withInput?null:false);
  });
}

/* ================= FIREBASE REAL-TIME SYNC & VS CODE OTA ================= */
function isFirebaseConfigured(){
  const cfg=db.firebase;
  return !!(cfg&&cfg.apiKey&&cfg.databaseURL&&cfg.projectId);
}
function getFbStatusText(){
  if(fbStatusState==='not_configured')return t('firebaseStatusNotConfigured');
  if(fbStatusState==='initializing')return 'Initializing...';
  if(fbStatusState==='connected_google')return `${t('firebaseStatusConnectedAs')} ${fbStatusMsg}`;
  if(fbStatusState==='connected_anon')return t('firebaseStatusConnected');
  if(fbStatusState==='error')return `${t('firebaseStatusError')}: ${fbStatusMsg}`;
  if(fbStatusState==='custom')return fbStatusMsg;
  return t('firebaseStatusNotConfigured');
}
function setFbStatus(state,msg=''){
  fbStatusState=state;
  fbStatusMsg=msg;
  const badge=document.getElementById('fbStatusBadge');
  if(badge){
    badge.textContent=getFbStatusText();
    badge.style.color=(state==='error')?'var(--danger)':(state.startsWith('connected')||state==='custom')?'#16a34a':'var(--muted)';
  }
}
function handleFirebaseError(err){
  const code=(err&&err.code)?String(err.code):'';
  const msg=(err&&err.message)?String(err.message):String(err||'Unknown error');
  if(code==='auth/popup-closed-by-user'||code==='auth/cancelled-popup-request'){
    return 'popup-closed';
  }
  if(code==='auth/popup-blocked'){
    flashToast('Popup blocked — please allow popups');
  }else if(code==='auth/unauthorized-domain'){
    flashToast('Add your domain to Firebase Auth settings');
  }else if(code==='PERMISSION_DENIED'||code==='permission-denied'||/permission_denied/i.test(msg)){
    flashToast('Check your Firebase Realtime DB rules');
  }else{
    flashToast(`${t('firebaseStatusError')}: ${msg}`);
  }
  return code||msg;
}
function scheduleFirebaseInit(){
  clearTimeout(fbInitTimer);
  setFbStatus('initializing');
  fbInitTimer=setTimeout(()=>initFirebaseIfConfigured(true),300);
}
async function initFirebaseIfConfigured(reinit=false){
  if(!isFirebaseConfigured()){
    setFbStatus('not_configured');
    return;
  }
  const cfg=db.firebase;
  setFbStatus('initializing');
  try{
    if(reinit&&fbApp){
      try{await deleteApp(fbApp)}catch(e){console.warn('deleteApp',e)}
      fbApp=null;fbAuth=null;fbDb=null;fbUid=null;fbListening=false;fbAuthBound=false;
    }
    if(!fbApp){
      const apps=getApps();
      fbApp=apps.length?apps[0]:initializeApp({
        apiKey:cfg.apiKey,
        authDomain:cfg.authDomain||`${cfg.projectId}.firebaseapp.com`,
        databaseURL:cfg.databaseURL,
        projectId:cfg.projectId,
        storageBucket:cfg.storageBucket||undefined,
        messagingSenderId:cfg.messagingSenderId||undefined,
        appId:cfg.appId||undefined
      });
      fbAuth=getAuth(fbApp);
      fbDb=getDatabase(fbApp);
    }
    if(!fbAuthBound){
      fbAuthBound=true;
      onAuthStateChanged(fbAuth,(user)=>{
        if(user){
          fbUid=user.uid;
          db.firebase.connected=true;
          if(!user.isAnonymous&&user.email){
            db.firebase.googleUser={
              displayName:user.displayName||'',
              email:user.email||'',
              photoURL:user.photoURL||'',
              uid:user.uid
            };
            setFbStatus('connected_google',user.email);
          }else{
            db.firebase.googleUser=null;
            setFbStatus('connected_anon');
          }
          save();
          updateNavAvatar();
          if(!fbListening)startFirebaseRoomListener();
          if(!settingsView.classList.contains('hidden')&&settingsStack[settingsStack.length-1]==='firebase-sync')renderSettingsPage();
        }else{
          fbUid=null;
          signInAnonymously(fbAuth).catch((err)=>{
            console.warn('Anonymous sign-in failed',err);
            setFbStatus('error',err.message||'Auth failed');
          });
        }
      });
    }
  }catch(e){
    console.warn('Firebase init error',e);
    db.firebase.connected=false;
    setFbStatus('error',e.message||'Invalid config');
  }
}
async function signInWithGoogle(){
  if(!isFirebaseConfigured()||!fbAuth){
    flashToast('Configure Firebase first');
    return;
  }
  try{
    const provider=new GoogleAuthProvider();
    const res=await signInWithPopup(fbAuth,provider);
    const user=res.user;
    db.firebase.googleUser={
      displayName:user.displayName||'',
      email:user.email||'',
      photoURL:user.photoURL||'',
      uid:user.uid
    };
    fbUid=user.uid;
    db.firebase.connected=true;
    save();
    updateNavAvatar();
    setFbStatus('connected_google',user.email||'Google');
    if(!fbListening)startFirebaseRoomListener();
    if(!settingsView.classList.contains('hidden'))renderSettingsPage();
  }catch(err){
    const code=handleFirebaseError(err);
    if(code==='popup-closed'){
      try{await signInAnonymously(fbAuth)}catch(e2){console.warn(e2)}
    }else{
      setFbStatus('error',err.message||'Sign-in failed');
    }
  }
}
async function signOutGoogle(){
  if(!fbAuth)return;
  try{
    await signOut(fbAuth);
    db.firebase.googleUser=null;
    save();
    updateNavAvatar();
    await signInAnonymously(fbAuth);
    setFbStatus('connected_anon');
    if(!settingsView.classList.contains('hidden'))renderSettingsPage();
  }catch(err){
    console.warn('Sign out error',err);
    handleFirebaseError(err);
  }
}
async function testFirebaseConnection(){
  if(!fbDb||!fbUid){
    flashToast('Configure Firebase first');
    return;
  }
  const room=db.firebase.roomCode||'code3412';
  const pingRef=ref(fbDb,`rooms/${room}/ping`);
  setFbStatus('initializing');
  try{
    const payload={at:Date.now(),by:fbUid};
    await set(pingRef,payload);
    const snap=await get(pingRef);
    if(snap.exists()){
      setFbStatus('custom',`Ping OK (${new Date(snap.val().at).toLocaleTimeString()})`);
    }else{
      setFbStatus('error','Read returned empty');
    }
  }catch(err){
    console.warn('Ping error',err);
    handleFirebaseError(err);
    setFbStatus('error',err.message||'Permission denied');
  }
}
function startFirebaseRoomListener(){
  if(!fbDb||!fbUid||fbListening)return;
  fbListening=true;
  const room=db.firebase.roomCode||'code3412';
  const q=query(ref(fbDb,`rooms/${room}/messages`),limitToLast(40));
  let squadChat=db.chats.find(c=>c.official)||db.chats.find(c=>!c.saved);
  onChildAdded(q,(snap)=>{
    const m=snap.val();
    if(!m||!squadChat)return;
    if(squadChat.messages.some(x=>x.fbKey===snap.key))return;
    const isMe=m.uid===fbUid;
    const newMsg={
      id:uid(),fbKey:snap.key,type:m.type==='voice'?'audio':(m.type||'text'),
      media:m.audioData||m.media||'',
      text:isMe?(m.text||''):`${m.name||'Friend'}: ${m.text||''}`,
      sender:isMe?'me':'them',time:m.timestamp||Date.now(),status:'read'
    };
    squadChat.messages.push(newMsg);
    squadChat.updatedAt=newMsg.time;
    if(db.activeId!==squadChat.id)squadChat.unread=(squadChat.unread||0)+1;
    save();
    if(db.activeId===squadChat.id)renderMessages();
    renderChatList();
    if(!isMe&&m.timestamp>appStartTime&&db.tgSettings.notiEnabled){
      if("Notification" in window&&Notification.permission==="granted"){
        new Notification(m.name||'Telechat',{body:m.text||'New message'});
      }else{
        flashToast(`💬 ${m.name||'Friend'}: ${m.text||''}`);
      }
    }
  },(err)=>{
    console.warn('RTDB listen error',err);
    handleFirebaseError(err);
    setFbStatus('error',err.message||'Read error');
  });

  // Listen for VS Code Live OTA reload signal in Firebase
  onValue(ref(fbDb,`rooms/${room}/ota_version`),(snap)=>{
    const ver=snap.val();
    if(!ver||!ver.timestamp)return;
    const lastOtaVer=Number(localStorage.getItem('telechat_last_ota_ver')||0);
    if(!lastOtaVer){
      localStorage.setItem('telechat_last_ota_ver',String(ver.timestamp));
      return;
    }
    if(ver.timestamp>lastOtaVer){
      localStorage.setItem('telechat_last_ota_ver',String(ver.timestamp));
      flashToast('⚡ VS Code OTA Update detected — Reloading...');
      setTimeout(()=>window.location.reload(),900);
    }
  },(err)=>{
    console.warn('OTA listen error',err);
  });
}

function detectLang(text){
  if(/[\u1000-\u109F]/.test(text))return 'my';
  if(/[\uAC00-\uD7AF\u1100-\u11FF]/.test(text))return 'ko';
  if(/[\u3040-\u30FF]/.test(text))return 'ja';
  if(/[\u0400-\u04FF]/.test(text))return 'ru';
  if(/[A-Za-z]/.test(text))return 'en';
  return currentLang;
}
function generateReply(text){
  const raw=String(text||'').trim();const t2=raw.toLowerCase();
  const lang=(messageLang==='auto')?detectLang(raw):messageLang;
  const R=REPLY[lang]||REPLY.en;
  const has=(...r)=>r.some(x=>x.test(t2));
  if(has(/မင်္ဂလာပါ/,/ဟယ်လို/,/\bhello\b/,/\bhi\b/,/안녕/,/こんにちは/,/привет/i))return pick(R.greet);
  if(has(/နေကောင်းလား/,/how are you/i))return pick(R.how);
  if(has(/ကျေးဇူး/,/thanks/i))return pick(R.thanks);
  if(has(/ဘိုင်/,/\bbye\b/i))return pick(R.bye);
  if(has(/လား/,/လဲ/,/\?/i))return pick(R.q);
  if(has(/အိုကေ/,/ဟုတ်ကဲ့/,/\bok\b/i))return pick(R.ok);
  return pick(R.general);
}

function applyWallpaperTo(el,wp){
  el.style.backgroundImage='';el.style.backgroundSize='';el.style.backgroundPosition='';el.style.backgroundColor='';
  if(!wp||wp.mode==='default'){el.style.backgroundColor='var(--chat-bg)';return}
  if(wp.mode==='color'){el.style.backgroundColor=wp.value;return}
  if(wp.mode==='gradient'){el.style.backgroundImage=wp.value;return}
  if(wp.mode==='pattern'){
    el.style.backgroundColor='var(--chat-bg)';
    if(wp.pattern==='dots'){el.style.backgroundImage='radial-gradient(circle, rgba(0,0,0,.09) 1.2px, transparent 1.2px)';el.style.backgroundSize='22px 22px'}
    else if(wp.pattern==='stripes'){el.style.backgroundImage='repeating-linear-gradient(45deg, rgba(0,0,0,.05) 0 12px, transparent 12px 24px)'}
    else if(wp.pattern==='grid'){el.style.backgroundImage='linear-gradient(rgba(0,0,0,.055) 1px, transparent 1px), linear-gradient(90deg, rgba(0,0,0,.055) 1px, transparent 1px)';el.style.backgroundSize='28px 28px'}
    return;
  }
  if(wp.mode==='image'){el.style.backgroundColor='#0e1621';el.style.backgroundImage=`url("${wp.value}")`;el.style.backgroundSize='cover';el.style.backgroundPosition='center'}
}

function compressImage(file,maxSide=1280,quality=0.78){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onerror=()=>reject(new Error('read error'));
    r.onload=()=>{
      const img=new Image();
      img.onerror=()=>reject(new Error('image error'));
      img.onload=()=>{
        let w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;
        const s=Math.min(1,maxSide/Math.max(w,h));
        w=Math.max(1,Math.round(w*s));h=Math.max(1,Math.round(h*s));
        const c=document.createElement('canvas');c.width=w;c.height=h;
        const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);
        resolve(c.toDataURL('image/jpeg',quality));
      };
      img.src=r.result;
    };
    r.readAsDataURL(file);
  });
}
function fileToDataUrl(file){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(new Error('read error'));r.readAsDataURL(file);
  });
}

function renderChatList(){
  const q=searchInput.value.trim().toLowerCase();
  const activeFolder=db.folders.find(f=>f.id===db.activeFolder)||db.folders[0];
  const list=db.chats.filter(c=>{
    if(q&&!c.name.toLowerCase().includes(q))return false;
    if(activeFolder&&activeFolder.id!=='all'){if(!c.name.toLowerCase().includes(activeFolder.name.toLowerCase()))return false}
    return true;
  }).sort((a,b)=>{
    if(a.saved)return -1;if(b.saved)return 1;
    return (b.updatedAt||0)-(a.updatedAt||0);
  });
  if(list.length===0){chatListEl.innerHTML=`<div class="empty-list">${q?'No chats match your search':t('chooseChat')}</div>`;return}
  chatListEl.innerHTML=list.map(chat=>{
    const m=lastMsg(chat);
    let preview;
    if(m){const prefix=chat.saved?'':(m.sender==='me'?(currentLang==='my'?'သင်: ':currentLang==='ko'?'나: ':currentLang==='ja'?'あなた: ':currentLang==='ru'?'Вы: ':'You: '):'');preview=prefix+previewText(m).replace(/\n/g,' ')}
    else preview='—';
    const time=m?fmtListTime(m.time):'';
    const active=chat.id===db.activeId?' active':'';
    const avatarHtml=chat.saved?`<div class="avatar saved">${SVG_IC.bookmark}</div>`:`<div class="avatar" style="background:${avatarColor(chat.name)}">${esc(initials(chat.name))}</div>`;
    const verifiedHtml=chat.official?`<span class="verified"><svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 12 10 17 19 8"/></svg></span>`:'';
    return `<div class="chat-item${active}" data-id="${chat.id}">${avatarHtml}<div class="chat-body"><div class="chat-row"><div class="chat-name">${esc(chat.name)}${verifiedHtml}</div><div class="chat-time">${time}</div></div><div class="chat-row"><div class="chat-preview">${esc(preview.slice(0,60))}</div>${chat.unread>0?`<div class="badge">${chat.unread}</div>`:''}</div></div>${chat.saved?'':`<button class="del-btn" data-del="${chat.id}" title="Delete">${SVG_IC.close}</button>`}</div>`;
  }).join('');
}

/* ================= RENDER CHAT ================= */
function renderMessages(){
  const chat=getActiveChat();if(!chat)return;
  let html='';let lastDate='';
  chat.messages.forEach(m=>{
    const dSep=fmtDateSep(m.time);
    if(dSep!==lastDate){html+=`<div class="date-sep">${dSep}</div>`;lastDate=dSep}
    const isOut=m.sender==='me';
    let tick=isOut?((m.status==='read'||m.status==='delivered')?'<span class="tick">✓✓</span>':'<span class="tick">✓</span>'):'';
    let quoteHtml='';
    if(m.replyTo){
      const quoted=chat.messages.find(x=>x.id===m.replyTo);
      const qName=quoted?(quoted.sender==='me'?(currentLang==='my'?'သင်':'You'):esc(chat.name)):'';
      const qText=quoted?esc(previewText(quoted).replace(/\n/g,' ').slice(0,90)):'—';
      quoteHtml=`<div class="quoted" data-goto="${quoted?quoted.id:''}"><div class="q-name">${qName}</div><div class="q-text">${qText}</div></div>`;
    }
    const editedMark=m.edited?'<span class="edited">edited</span>':'';
    if(m.type==='photo'){
      html+=`<div class="msg ${isOut?'out':'in'}" data-mid="${m.id}"><div class="bubble media">${quoteHtml}<img class="msg-img" src="${m.media}" alt="" data-lightbox="${m.id}" />${m.text?`<div class="caption">${esc(m.text)}</div>`:''}<div class="meta">${editedMark}<span>${fmtTime(m.time)}</span>${tick}</div></div></div>`;
    }else if(m.type==='video'){
      html+=`<div class="msg ${isOut?'out':'in'}" data-mid="${m.id}"><div class="bubble media">${quoteHtml}<video class="msg-video" src="${m.media}" controls preload="metadata"></video>${m.text?`<div class="caption">${esc(m.text)}</div>`:''}<div class="meta">${editedMark}<span>${fmtTime(m.time)}</span>${tick}</div></div></div>`;
    }else if(m.type==='audio'){
      html+=`<div class="msg ${isOut?'out':'in'}" data-mid="${m.id}"><div class="bubble audio">${quoteHtml}<audio class="msg-audio" src="${m.media}" controls preload="metadata"></audio>${m.text?`<div class="caption" style="font-size:13.5px;margin-bottom:2px">${esc(m.text)}</div>`:''}<div class="meta">${editedMark}<span>${fmtTime(m.time)}</span>${tick}</div></div></div>`;
    }else if(m.type==='file'){
      const sizeStr=m.fileSize?fmtBytes(m.fileSize):'';
      html+=`<div class="msg ${isOut?'out':'in'}" data-mid="${m.id}"><div class="bubble file">${quoteHtml}<div class="file-card"><div class="file-icon">${SVG_IC.fileIcon}</div><div class="file-info"><div class="file-name">${esc(m.fileName||'File')}</div><div class="file-size">${esc(sizeStr)}</div></div><a class="file-dl" href="${m.media}" download="${esc(m.fileName||'file')}" title="Download">${SVG_IC.download}</a></div>${m.text?`<div class="caption" style="font-size:13.5px;padding:0 4px 4px">${esc(m.text)}</div>`:''}<div class="meta">${editedMark}<span>${fmtTime(m.time)}</span>${tick}</div></div></div>`;
    }else{
      html+=`<div class="msg ${isOut?'out':'in'}" data-mid="${m.id}"><div class="bubble">${quoteHtml}${esc(m.text)}<div class="meta">${editedMark}<span>${fmtTime(m.time)}</span>${tick}</div></div></div>`;
    }
  });
  messagesEl.innerHTML=html;
  scrollToBottom();renderPinned(chat);applyWallpaperTo(messagesEl,wallpaperFor(chat));
}
function scrollToBottom(){requestAnimationFrame(()=>{messagesEl.scrollTop=messagesEl.scrollHeight})}
function renderPinned(chat){
  if(chat.pinnedId){
    const m=chat.messages.find(x=>x.id===chat.pinnedId);
    if(m){pinnedBar.classList.remove('hidden');pinnedText.textContent=previewText(m).replace(/\n/g,' ').slice(0,100);return}
    chat.pinnedId=null;save();
  }
  pinnedBar.classList.add('hidden');
}

/* ================= OPEN/CLOSE ================= */
function openChat(id){
  const chat=db.chats.find(c=>c.id===id);if(!chat)return;
  settingsStack=[];settingsView.classList.add('hidden');
  db.activeId=id;chat.unread=0;cancelReply();cancelEdit();save();
  emptyState.classList.add('hidden');chatView.classList.remove('hidden');appEl.classList.add('show-chat');
  if(chat.saved){chatAvatar.className='avatar sm saved';chatAvatar.innerHTML=SVG_IC.bookmark;chatAvatar.style.background=''}
  else{chatAvatar.className='avatar sm';chatAvatar.style.background=avatarColor(chat.name);chatAvatar.textContent=initials(chat.name)}
  chatName.textContent=chat.name;
  chatStatus.textContent=chat.saved?'':t('lastSeen');chatStatus.classList.remove('typing');
  renderChatList();renderMessages();
  if(window.innerWidth>820)msgInput.focus();
}
function closeChatView(){
  db.activeId=null;cancelReply();cancelEdit();save();
  chatView.classList.add('hidden');emptyState.classList.remove('hidden');appEl.classList.remove('show-chat');renderChatList();
}

function renderLanguagePage(kind){
  const cur=kind==='app'?currentLang:messageLang;

  const desc=kind==='app'?t('languageDesc'):t('messageLanguageDesc');

async function updateStorageSize(){
  const el=document.getElementById('storageSize');const fill=document.getElementById('storageBarFill');
  if(!el)return;
  let localBytes=0;
  try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);const v=localStorage.getItem(k)||'';localBytes+=(k.length+v.length)*2}}catch(e){}
  el.textContent=fmtBytes(localBytes);
  if(fill)fill.style.width=Math.min(100,(localBytes/(5*1024*1024))*100)+'%';
}

function sendMessage(){
  const chat=getActiveChat();if(!chat)return;
  const text=msgInput.value.trim();
  if(editingId){
    if(!text){cancelEdit();return}
    const m=chat.messages.find(x=>x.id===editingId);
    if(m){m.text=text;m.edited=true}
    cancelEdit();save();msgInput.value='';msgInput.style.height='auto';renderMessages();renderChatList();return;
  }
  if(!text)return;
  const msg={id:uid(),type:'text',text,sender:'me',time:Date.now(),status:'sent',replyTo:chat.replyTo||null};
  chat.messages.push(msg);chat.updatedAt=msg.time;
  cancelReply();save();msgInput.value='';msgInput.style.height='auto';
  renderMessages();renderChatList();

  if(fbDb&&fbUid&&!chat.saved){
    const room=db.firebase.roomCode||'code3412';
    const senderName=(db.firebase.googleUser&&db.firebase.googleUser.displayName)||db.profile.name||'You';
    const newRef=push(ref(fbDb,`rooms/${room}/messages`));
    set(newRef,{uid:fbUid,name:senderName,type:'text',text,timestamp:msg.time}).catch((err)=>{
      console.warn('Firebase send error',err);
      handleFirebaseError(err);
    });
  }else{
    simulateReply(chat.id,msg.id,chat.saved);
  }
}

async function sendMedia(file,kind){
  const chat=getActiveChat();if(!chat||!file)return;
  if(file.size>MAX_FILE_SIZE){flashToast(t('toastFileTooBig'));return}
  const caption=msgInput.value.trim();
  try{
    let media,type=kind;
    if(kind==='photo')media=await compressImage(file,1280,0.75);
    else media=await fileToDataUrl(file);
    const msg={id:uid(),type,media,text:caption,sender:'me',time:Date.now(),status:'sent',replyTo:chat.replyTo||null};
    if(kind==='file'){msg.fileName=file.name||'file';msg.fileSize=file.size||0}
    chat.messages.push(msg);chat.updatedAt=msg.time;cancelReply();msgInput.value='';msgInput.style.height='auto';
    if(save()){renderMessages();renderChatList();simulateReply(chat.id,msg.id,chat.saved)}
  }catch(e){flashToast(t('toastImageRead'))}
}

function simulateReply(chatId,msgId,isSaved){
  setTimeout(()=>{
    const c=db.chats.find(x=>x.id===chatId);if(!c)return;
    const mm=c.messages.find(x=>x.id===msgId);if(mm&&mm.status==='sent')mm.status='delivered';
    if(db.activeId===chatId)renderMessages();save();
    if(!isSaved)scheduleReply(chatId);
  },500);
}
function scheduleReply(chatId){
  clearTimeout(typingTimers[chatId]);
  typingTimers[chatId]=setTimeout(()=>{
    const chat=db.chats.find(c=>c.id===chatId);if(!chat||chat.saved)return;
    const last=[...chat.messages].reverse().find(m=>m.sender==='me');if(!last)return;
    if(db.activeId===chatId){chatStatus.textContent=t('typing');chatStatus.classList.add('typing')}
    setTimeout(()=>{
      const c2=db.chats.find(c=>c.id===chatId);if(!c2)return;
      const reply={id:uid(),type:'text',text:generateReply(last.text||''),sender:'them',time:Date.now(),status:'read'};
      c2.messages.push(reply);c2.updatedAt=reply.time;
      c2.messages.forEach(m=>{if(m.sender==='me')m.status='read'});
      if(db.activeId!==chatId)c2.unread=(c2.unread||0)+1;
      save();
      if(db.activeId===chatId){chatStatus.textContent=t('lastSeen');chatStatus.classList.remove('typing');renderMessages()}
      renderChatList();
    },900);
  },450);
}

function createChat(name){const chat={id:uid(),name:name.trim(),messages:[],unread:0,updatedAt:Date.now()};db.chats.push(chat);save();renderChatList();openChat(chat.id)}
async function deleteChat(id){
  if(id===SAVED_ID)return;
  const chat=db.chats.find(c=>c.id===id);if(!chat)return;
  const ok=await openDialog({title:t('delete'),desc:`Delete "${chat.name}"?`,danger:true});
  if(!ok)return;
  db.chats=db.chats.filter(c=>c.id!==id);
  if(db.activeId===id){db.activeId=null;chatView.classList.add('hidden');emptyState.classList.remove('hidden');appEl.classList.remove('show-chat')}
  save();renderChatList();
}

function startReply(msgId){
  const chat=getActiveChat();if(!chat)return;
  cancelEdit();chat.replyTo=msgId;
  const m=chat.messages.find(x=>x.id===msgId);if(!m)return;
  replyName.textContent=m.sender==='me'?t('you'):chat.name;
  replyText.textContent=previewText(m).slice(0,90);
  replyBar.classList.remove('hidden');msgInput.focus();
}
function cancelReply(){const chat=getActiveChat();if(chat)chat.replyTo=null;replyBar.classList.add('hidden')}
function startEdit(msgId){
  const chat=getActiveChat();if(!chat)return;
  const m=chat.messages.find(x=>x.id===msgId);if(!m||m.sender!=='me'||m.type!=='text')return;
  cancelReply();editingId=msgId;editLabel.textContent=t('editMessage');msgInput.value=m.text;
  editPreview.textContent=m.text.slice(0,90);editBar.classList.remove('hidden');msgInput.focus();
}
function cancelEdit(){editingId=null;editBar.classList.add('hidden');msgInput.value=''}

function saveToSaved(msgId){
  const chat=getActiveChat();if(!chat)return;
  const m=chat.messages.find(x=>x.id===msgId);if(!m)return;
  const savedChat=db.chats.find(c=>c.id===SAVED_ID);if(!savedChat)return;
  savedChat.messages.push({id:uid(),sender:'me',time:Date.now(),status:'read',type:m.type,media:m.media,text:m.text||'',fileName:m.fileName,fileSize:m.fileSize});
  savedChat.updatedAt=Date.now();save();renderChatList();flashToast(t('toastSaved'));
}

function flashToast(text){
  const el=document.createElement('div');el.textContent=text;
  el.style.cssText='position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:rgba(0,0,0,.84);color:#fff;padding:10px 18px;border-radius:22px;font-size:13px;z-index:200;pointer-events:none;max-width:88vw;text-align:center;';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),2000);
}

function togglePin(msgId){const chat=getActiveChat();if(!chat)return;chat.pinnedId=(chat.pinnedId===msgId)?null:msgId;save();renderPinned(chat)}
function deleteMessage(msgId){const chat=getActiveChat();if(!chat)return;chat.messages=chat.messages.filter(m=>m.id!==msgId);if(chat.pinnedId===msgId)chat.pinnedId=null;save();renderMessages();renderChatList()}
async function clearChatHistory(){

function openCtxMenu(x,y,chatId,msgId){
  ctxMsg={chatId,msgId};const chat=db.chats.find(c=>c.id===chatId);const m=chat&&chat.messages.find(mm=>mm.id===msgId);
  const editBtn=ctxMenu.querySelector('[data-act="edit"]');editBtn.style.display=(m&&m.sender==='me'&&m.type==='text')?'':'none';
  ctxMenu.classList.remove('hidden');
  ctxMenu.style.left=Math.min(x,window.innerWidth-220)+'px';ctxMenu.style.top=Math.min(y,window.innerHeight-240)+'px';
}
function closeCtxMenu(){ctxMenu.classList.add('hidden');ctxMsg=null}
ctxMenu.addEventListener('click',e=>{
  const btn=e.target.closest('button[data-act]');if(!btn||!ctxMsg)return;
  const act=btn.dataset.act,{chatId,msgId}=ctxMsg;
  if(act==='reply')startReply(msgId);
  else if(act==='copy'){const chat=db.chats.find(c=>c.id===chatId);const m=chat&&chat.messages.find(mm=>mm.id===msgId);if(m){navigator.clipboard?.writeText(m.text||'');flashToast(t('toastCopied'))}}
  else if(act==='edit')startEdit(msgId);
  else if(act==='save')saveToSaved(msgId);
  else if(act==='pin')togglePin(msgId);
  else if(act==='delete')deleteMessage(msgId);
  closeCtxMenu();
});
document.addEventListener('click',e=>{
  if(!ctxMenu.classList.contains('hidden')&&!ctxMenu.contains(e.target))closeCtxMenu();
  if(!chatDropdown.classList.contains('hidden')&&!chatDropdown.contains(e.target)&&e.target!==chatMenuBtn)chatDropdown.classList.add('hidden');
});
messagesEl.addEventListener('contextmenu',e=>{
